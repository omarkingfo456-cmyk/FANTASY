<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>فاتورة صيانة جديدة - Fantasy Store</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #070b12;
    color: #fff;
    font-family: Arial, sans-serif;
}

/* العنوان */
.header {
    height: 75px;
    background: #101722;
    border-bottom: 1px solid #26364a;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

.header h1 {
    color: #f5c542;
    margin: 0;
    font-size: 28px;
}

.cloud {
    position: absolute;
    left: 25px;
    color: #20d878;
    font-weight: bold;
}

/* صندوق الفاتورة */
.invoice {
    width: 75%;
    margin: 35px auto;
    background: #0d1520;
    border: 1px solid #263d58;
    border-radius: 18px;
    padding: 30px;
    box-shadow: 0 0 25px rgba(0,0,0,.35);
}

.invoice-title {
    text-align: center;
    color: #f5c542;
    font-size: 30px;
    margin-bottom: 30px;
}

/* قطاعي وتجاري */
.type {
    display: flex;
    gap: 15px;
    margin-bottom: 30px;
}

.type button {
    flex: 1;
    height: 52px;
    border: 1px solid #36516f;
    border-radius: 9px;
    background: #121f2f;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

.type button.active {
    background: #f5c542;
    color: #111;
    font-weight: bold;
}

/* البيانات */
.row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
    margin-bottom: 22px;
}

.field label {
    display: block;
    margin-bottom: 8px;
    color: #dce5ef;
    font-weight: bold;
}

.field input {
    width: 100%;
    height: 45px;
    border-radius: 8px;
    border: 1px solid #36516f;
    background: #111d2b;
    color: white;
    padding: 0 12px;
    font-size: 16px;
    outline: none;
}

.field input:focus {
    border-color: #f5c542;
}

/* الدراعات */
.controllers {
    display: flex;
    gap: 30px;
    margin-top: 10px;
}

.controller {
    flex: 1;
}

.controller label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
}

.controller input {
    width: 130px;
    height: 45px;
    background: #111d2b;
    border: 1px solid #36516f;
    border-radius: 8px;
    color: white;
    text-align: center;
    font-size: 18px;
}

/* الأزرار */
.actions {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 30px;
}

.actions button {
    height: 50px;
    padding: 0 25px;
    border-radius: 9px;
    border: 1px solid #36516f;
    background: #142438;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

.actions .save {
    background: #087cf5;
    border-color: #087cf5;
    font-weight: bold;
}

.actions button:hover {
    opacity: .85;
}

/* قسم الدراعات */
.add {
    margin-top: 30px;
    min-height: 220px;
    border: 1px dashed #315b87;
    border-radius: 13px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.gamepad {
    font-size: 70px;
}

.add h2 {
    color: #f5c542;
    margin: 8px;
    font-size: 21px;
}

.add p {
    color: #aebdce;
}

/* النجاح */
.success {
    display: none;
    text-align: center;
    color: #20d878;
    margin-top: 15px;
    font-weight: bold;
}

/* رجوع */
.back {
    position: fixed;
    left: 20px;
    bottom: 20px;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    background: #121e2c;
    border: 1px solid #3a5068;
    color: white;
    font-size: 22px;
    cursor: pointer;
}

/* موبايل */
@media(max-width:700px) {

    .invoice {
        width: 94%;
        padding: 18px;
    }

    .row {
        grid-template-columns: 1fr;
    }

    .controllers {
        flex-direction: column;
    }

    .header h1 {
        font-size: 20px;
    }

    .cloud {
        display: none;
    }
}
</style>
</head>

<body>

<div class="header">

    <h1>مرحبا بك في صيانة الدراعات</h1>

    <div class="cloud">
        متصل بالسحابة (مباشر) ✅
    </div>

</div>

<div class="invoice">

    <div class="invoice-title">
        فاتورة صيانة جديدة
    </div>

    <!-- نوع الفاتورة -->
    <div class="type">

        <button class="active" onclick="selectType(this)">
            قطاعي
        </button>

        <button onclick="selectType(this)">
            تجاري
        </button>

    </div>

    <!-- كود + تاريخ -->
    <div class="row">

        <div class="field">
            <label>كود الفاتورة</label>
            <input id="invoiceCode" type="text" placeholder="اكتب كود الفاتورة">
        </div>

        <div class="field">
            <label>التاريخ</label>
            <input id="date" type="date">
        </div>

    </div>

    <!-- العميل + الهاتف -->
    <div class="row">

        <div class="field">
            <label>اسم العميل</label>
            <input id="customer" type="text" placeholder="اكتب اسم العميل">
        </div>

        <div class="field">
            <label>رقم الهاتف</label>
            <input id="phone" type="tel" placeholder="اكتب رقم الهاتف">
        </div>

    </div>

    <!-- أعداد الدراعات -->
    <div class="controllers">

        <div class="controller">
            <label>عدد دراعات PS5</label>
            <input id="ps5" type="number" min="0" value="0">
        </div>

        <div class="controller">
            <label>عدد دراعات PS4</label>
            <input id="ps4" type="number" min="0" value="0">
        </div>

    </div>

    <!-- الأزرار -->
    <div class="actions">

        <button onclick="printReceipt()">
            🖨️ طباعة ريسيت استلام
        </button>

        <button class="save" onclick="saveData()">
            💾 حفظ بيانات الاستلام
        </button>

    </div>

    <div class="success" id="success">
        ✔ تم حفظ بيانات الاستلام بنجاح
    </div>

    <!-- إضافة الدراعات -->
    <div class="add">

        <div class="gamepad">🎮</div>

        <h2>
            احفظ بيانات الاستلام أولاً
        </h2>

        <p>
            لتتمكن من إضافة الدراعات
        </p>

    </div>

</div>

<button class="back" onclick="goBack()" title="رجوع">
    🚪
</button>

<script>

/* تاريخ اليوم */
const today = new Date();

document.getElementById("date").value =
    today.toISOString().split("T")[0];


/* قطاعي / تجاري */
function selectType(button) {

    document.querySelectorAll(".type button")
        .forEach(function(btn) {
            btn.classList.remove("active");
        });

    button.classList.add("active");
}


/* حفظ البيانات */
function saveData() {

    const customer =
        document.getElementById("customer").value;

    const phone =
        document.getElementById("phone").value;

    if (customer === "" || phone === "") {

        alert("من فضلك اكتب اسم العميل ورقم الهاتف");

        return;
    }

    document.getElementById("success").style.display = "block";

}


/* طباعة */
function printReceipt() {
    window.print();
}


/* رجوع */
function goBack() {
    window.location.href = "controllers.html";
}

</script>
<script>
function saveData() {
    const data = {};

    document.querySelectorAll("input, textarea, select").forEach((element, index) => {
        const key = element.id || "field_" + index;
        data[key] = element.value;
    });

    localStorage.setItem("fantasyStoreData", JSON.stringify(data));

    alert("✅ تم حفظ البيانات بنجاح");
}

function loadData() {
    const saved = localStorage.getItem("fantasyStoreData");

    if (!saved) return;

    const data = JSON.parse(saved);

    document.querySelectorAll("input, textarea, select").forEach((element, index) => {
        const key = element.id || "field_" + index;

        if (data[key] !== undefined) {
            element.value = data[key];
        }
    });
}

window.addEventListener("load", loadData);
</script>
</body>
</html>
<button onclick="saveData()" style="background:#1677ff;color:white;">
    💾 حفظ بيانات الاستلام
</button>
