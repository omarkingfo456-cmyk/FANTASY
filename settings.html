<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الإعدادات - Fantasy Store</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#080b10;
    color:white;
}

.top-bar{
    height:70px;
    background:#111720;
    border-bottom:1px solid #29313d;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
}

.top-title{
    color:#f5c542;
    font-size:24px;
    font-weight:bold;
}

.content{
    max-width:1000px;
    margin:auto;
    padding:30px 20px 100px;
}

.page-title{
    color:#f5c542;
    font-size:30px;
    font-weight:bold;
    margin-bottom:5px;
}

.page-subtitle{
    color:#8e98a5;
    margin-bottom:25px;
}

.card{
    background:#0d141d;
    border:1px solid #164b7d;
    border-radius:15px;
    padding:20px;
    margin-bottom:18px;
}

.card-title{
    color:#dce8ff;
    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;
}

.phone-input,
textarea{
    width:100%;
    padding:12px;
    background:#070c12;
    color:white;
    border:1px solid #31516e;
    border-radius:8px;
    outline:none;
}

textarea{
    min-height:210px;
    resize:vertical;
    line-height:1.8;
    font-family:Arial,sans-serif;
}

.templates{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.template-box{
    background:#0b121a;
    border:1px solid #244c70;
    border-radius:12px;
    padding:15px;
}

.template-title{
    color:#dce8ff;
    font-size:17px;
    font-weight:bold;
    margin-bottom:10px;
}

.btn{
    background:#1677ff;
    color:white;
    border:none;
    border-radius:8px;
    padding:11px 20px;
    font-size:15px;
    cursor:pointer;
    margin:5px;
}

.btn:hover{
    background:#3189ff;
}

.danger{
    background:#8b2020;
}

.status{
    color:#00e5a0;
    margin-top:10px;
    font-weight:bold;
}

.bottom{
    position:fixed;
    left:20px;
    bottom:20px;
}

@media(max-width:800px){
    .templates{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<div class="top-bar">
    <div class="top-title">⚙️ إعدادات Fantasy Store</div>
</div>

<div class="content">

    <div class="page-title">الإعدادات</div>

    <div class="page-subtitle">
        التحكم في رقم الهاتف وقوالب رسائل واتساب والحفظ والنسخ الاحتياطي
    </div>


    <!-- رقم الهاتف -->

    <div class="card">

        <div class="card-title">
            📞 رقم هاتف المركز
        </div>

        <input
            id="centerPhone"
            class="phone-input"
            type="tel"
            placeholder="اكتب رقم الهاتف"
        >

    </div>


    <!-- القوالب -->

    <div class="templates">

        <div class="template-box">

            <div class="template-title">
                💬 قالب رسالة الاستلام
            </div>

            <textarea id="receiveTemplate">مرحباً أ/{{customer}} 👋
تم استلام دراعاتك بمركز Fantasy لإجراء الصيانة.
كود الفاتورة: {{code}}
التاريخ: {{date}}
نوع الفاتورة: {{type}}
عدد الدراعات: {{ps5}} / {{ps4}}
سنتواصل معك فور الانتهاء 🙏</textarea>

        </div>


        <div class="template-box">

            <div class="template-title">
                📄 قالب رسالة الفاتورة
            </div>

            <textarea id="invoiceTemplate">مرحباً أ/{{customer}} 👋
فاتورتك جاهزة، وده تفاصيلها:
رقم الفاتورة: {{code}}
اسم العميل: {{customer}}
الهاتف: {{phone}}
عدد الدراعات: {{controllers}}
إجمالي الحساب: {{total}}
شكراً لتعاملك مع Fantasy 🎮</textarea>

        </div>

    </div>


    <!-- الحفظ -->

    <div class="card">

        <div class="card-title">
            💾 حفظ الإعدادات
        </div>

        <button class="btn" onclick="saveSettings()">
            💾 حفظ القوالب والإعدادات
        </button>

        <button class="btn" onclick="saveSettings(); alert('تم حفظ كل البيانات بنجاح ✅')">
            ✅ حفظ الآن
        </button>

        <div id="status" class="status"></div>

    </div>


    <!-- النسخ الاحتياطي -->

    <div class="card">

        <div class="card-title">
            📦 النسخة الاحتياطية
        </div>

        <button class="btn" onclick="downloadBackup()">
            ⬇ تنزيل نسخة احتياطية
        </button>

        <button class="btn" onclick="document.getElementById('backupFile').click()">
            ↩ استعادة نسخة
        </button>

        <input
            id="backupFile"
            type="file"
            accept=".json"
            style="display:none"
            onchange="restoreBackup(event)"
        >

    </div>


    <!-- حذف البيانات -->

    <div class="card">

        <div class="card-title">
            🗑 إدارة البيانات
        </div>

        <button class="btn danger" onclick="clearSettings()">
            حذف إعدادات الموقع
        </button>

    </div>

</div>


<div class="bottom">

    <button class="btn" onclick="location.href='spare-parts.html'">
        ↩ رجوع
    </button>

</div>


<script>

const STORAGE_KEY = "fantasySettings";


/* تحميل البيانات */

function loadSettings(){

    try{

        const saved = localStorage.getItem(STORAGE_KEY);

        if(!saved) return;

        const settings = JSON.parse(saved);

        document.getElementById("centerPhone").value =
            settings.centerPhone || "";

        document.getElementById("receiveTemplate").value =
            settings.receiveTemplate || "";

        document.getElementById("invoiceTemplate").value =
            settings.invoiceTemplate || "";

    }catch(error){

        console.error(error);

    }

}


/* حفظ البيانات */

function saveSettings(){

    const settings = {

        centerPhone:
            document.getElementById("centerPhone").value,

        receiveTemplate:
            document.getElementById("receiveTemplate").value,

        invoiceTemplate:
            document.getElementById("invoiceTemplate").value

    };


    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(settings)
    );


    localStorage.setItem(
        "fantasyLastSave",
        new Date().toLocaleString("ar-EG")
    );


    document.getElementById("status").textContent =
        "✅ تم حفظ القوالب والإعدادات بنجاح";

}


/* تنزيل نسخة احتياطية */

function downloadBackup(){

    saveSettings();

    const backup = {

        fantasySettings:
            localStorage.getItem(STORAGE_KEY),

        fantasyLastSave:
            localStorage.getItem("fantasyLastSave"),

        backupDate:
            new Date().toLocaleString("ar-EG")

    };


    const blob = new Blob(
        [JSON.stringify(backup,null,2)],
        {type:"application/json"}
    );


    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");

    link.href = url;

    link.download = "Fantasy-Store-Backup.json";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

    URL.revokeObjectURL(url);

}


/* استعادة نسخة */

function restoreBackup(event){

    const file = event.target.files[0];

    if(!file) return;


    const reader = new FileReader();


    reader.onload = function(e){

        try{

            const backup = JSON.parse(e.target.result);


            if(backup.fantasySettings){

                localStorage.setItem(
                    STORAGE_KEY,
                    backup.fantasySettings
                );

            }


            if(backup.fantasyLastSave){

                localStorage.setItem(
                    "fantasyLastSave",
                    backup.fantasyLastSave
                );

            }


            loadSettings();

            document.getElementById("status").textContent =
                "✅ تم استعادة النسخة الاحتياطية بنجاح";

        }catch(error){

            alert("❌ ملف النسخة الاحتياطية غير صحيح");

        }

    };


    reader.readAsText(file);

}


/* حذف الإعدادات */

function clearSettings(){

    if(!confirm("هل أنت متأكد من حذف إعدادات الموقع؟")) return;

    localStorage.removeItem(STORAGE_KEY);

    localStorage.removeItem("fantasyLastSave");

    document.getElementById("centerPhone").value = "";

    document.getElementById("receiveTemplate").value = "";

    document.getElementById("invoiceTemplate").value = "";

    document.getElementById("status").textContent =
        "🗑 تم حذف الإعدادات";

}


/* تشغيل الصفحة */

window.addEventListener("DOMContentLoaded", function(){

    loadSettings();

});

</script>

</body>
</html>
