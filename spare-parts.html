<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>قطع الغيار - Fantasy Store</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0b0b0b;
            color: white;
        }

        /* الشريط العلوي */

        .top-bar {
            height: 70px;
            background: #151515;
            border-bottom: 1px solid #333;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 25px;
        }

        .top-title {
            font-size: 24px;
            font-weight: bold;
            color: #f5c542;
        }

        .cloud {
            color: #35d07f;
            font-size: 15px;
            font-weight: bold;
        }

        /* القائمة */

        .menu {
            position: fixed;
            right: 20px;
            top: 90px;

            width: 220px;

            background: #151515;
            border: 1px solid #333;
            border-radius: 14px;

            padding: 10px;
        }

        .menu h3 {
            text-align: center;
            color: #f5c542;
            margin: 5px 0 10px;
        }

        .menu button {
            width: 100%;

            padding: 12px 8px;
            margin: 4px 0;

            border: none;
            border-radius: 8px;

            background: #222;
            color: white;

            font-size: 15px;
            cursor: pointer;

            text-align: right;
        }

        .menu button:hover,
        .menu button.active {
            background: #f5c542;
            color: #111;
        }

        /* المحتوى */

        .content {
            margin-right: 270px;
            padding: 35px;
        }

        .page-title {
            font-size: 30px;
            color: #f5c542;
            margin-bottom: 5px;
        }

        .page-subtitle {
            color: #888;
            margin-bottom: 30px;
        }

        /* قسم قطع الغيار */

        .parts-section {
            background: #121212;

            border: 1px solid #303030;
            border-radius: 15px;

            margin-bottom: 30px;

            overflow: hidden;
        }

        .section-head {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 18px 20px;

            border-bottom: 1px solid #303030;
        }

        .console {
            font-size: 23px;
            font-weight: bold;
            color: white;
        }

        .add-btn {
            background: #1677ff;
            color: white;

            border: none;
            border-radius: 8px;

            padding: 10px 15px;

            font-size: 14px;
            cursor: pointer;
        }

        .add-btn:hover {
            background: #338cff;
        }

        /* العناوين */

        .table-head {
            display: grid;

            grid-template-columns:
                1.5fr
                1.3fr
                1fr
                1fr
                0.8fr
                1.5fr;

            gap: 10px;

            padding: 14px 20px;

            color: #888;
            font-size: 14px;

            background: #0e0e0e;
        }

        /* صف القطعة */

        .part-row {
            display: grid;

            grid-template-columns:
                1.5fr
                1.3fr
                1fr
                1fr
                0.8fr
                1.5fr;

            gap: 10px;

            align-items: center;

            padding: 15px 20px;

            border-top: 1px solid #282828;
        }

        .part-row:hover {
            background: #181818;
        }

        .part-name {
            font-weight: bold;
            color: white;
        }

        .part-type {
            color: #aaa;
        }

        .price {
            color: #f5c542;
        }

        .quantity {
            color: #35d07f;
            font-weight: bold;
        }

        .actions {
            display: flex;
            gap: 7px;
        }

        .actions button {
            border: none;
            border-radius: 6px;

            padding: 7px 10px;

            cursor: pointer;
            color: white;
        }

        .edit {
            background: #444;
        }

        .delete {
            background: #8b2020;
        }

        .edit:hover {
            background: #555;
        }

        .delete:hover {
            background: #b52b2b;
        }

        /* حالة عدم وجود قطع */

        .empty {
            padding: 25px;
            text-align: center;

            color: #666;

            border-top: 1px solid #282828;
        }

        /* النافذة */

        .modal {
            display: none;

            position: fixed;

            inset: 0;

            background: rgba(0, 0, 0, 0.75);

            align-items: center;
            justify-content: center;

            z-index: 1000;
        }

        .modal-box {
            width: 430px;
            max-width: 90%;

            background: #171717;

            border: 1px solid #444;
            border-radius: 15px;

            padding: 25px;
        }

        .modal-box h2 {
            margin-top: 0;

            color: #f5c542;

            text-align: center;
        }

        .modal-box label {
            display: block;

            margin-top: 14px;
            margin-bottom: 6px;

            color: #ddd;
        }

        .modal-box input,
        .modal-box select {
            width: 100%;

            padding: 11px;

            background: #0d0d0d;
            color: white;

            border: 1px solid #444;
            border-radius: 8px;

            outline: none;
        }

        .modal-box input:focus,
        .modal-box select:focus {
            border-color: #f5c542;
        }

        .modal-buttons {
            display: flex;

            gap: 10px;

            margin-top: 22px;
        }

        .modal-buttons button {
            flex: 1;

            padding: 11px;

            border: none;
            border-radius: 8px;

            cursor: pointer;

            font-size: 15px;
        }

        .cancel {
            background: #333;
            color: white;
        }

        .save {
            background: #1677ff;
            color: white;
        }

        /* أزرار أسفل الصفحة */

        .bottom-left {
            position: fixed;

            left: 20px;
            bottom: 20px;

            display: flex;
            gap: 10px;
        }

        .bottom-left button {
            width: 48px;
            height: 48px;

            border-radius: 50%;

            border: 1px solid #444;

            background: #151515;
            color: white;

            font-size: 20px;

            cursor: pointer;
        }

        /* الموبايل */

        @media (max-width: 800px) {

            .menu {
                position: static;
                width: auto;

                margin: 15px;
            }

            .content {
                margin-right: 0;
                padding: 20px;
            }

            .table-head {
                display: none;
            }

            .part-row {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }

            .actions {
                grid-column: 1 / -1;
            }

        }

    </style>

</head>


<body>

    <!-- الشريط العلوي -->

    <div class="top-bar">

        <div class="cloud">
            متصل بالسحابة (مباشر) ✅
        </div>

        <div class="top-title">
            قطع الغيار
        </div>

    </div>


    <!-- القائمة -->

    <div class="menu">

        <h3>القائمة</h3>

        <button onclick="window.location.href='new-invoice.html'">
            🧾 فاتورة جديدة
        </button>

        <button onclick="alert('تعديل فاتورة')">
            ✏️ تعديل فاتورة
        </button>

        <button onclick="alert('جدول أسعار')">
            💰 جدول أسعار
        </button>

        <button class="active">
            🔧 قطع غيار
        </button>

        <button onclick="alert('سجل الفواتير')">
            📋 سجل الفواتير
        </button>

        <button onclick="alert('الفواتير المعلقة')">
            ⏳ الفواتير المعلقة
        </button>

        <button onclick="alert('الاستلام والتسليم')">
            📦 الاستلام والتسليم
        </button>

        <button onclick="alert('فاتورة بيع')">
            🛒 فاتورة بيع
        </button>

     <button onclick="window.location.href='settings.html'">
    ⚙️ الإعدادات
</button>
    </div>


    <!-- المحتوى -->

    <div class="content">

        <div class="page-title">
            قطع الغيار
        </div>

        <div class="page-subtitle">
            إدارة قطع الغيار الخاصة بدراعات فور وفايف
        </div>


        <!-- PS4 -->

        <div class="parts-section">

            <div class="section-head">

                <div class="console">
                    PS4
                </div>

                <button class="add-btn" onclick="openAdd('PS4')">
                    ＋ إضافة قطعة
                </button>

            </div>


            <div class="table-head">

                <div>القطعة</div>
                <div>النوع</div>
                <div>قطاعي</div>
                <div>تجاري</div>
                <div>العدد</div>
                <div>الإجراءات</div>

            </div>


            <div id="ps4-list">

                <div class="empty" id="ps4-empty">
                    لا توجد قطع غيار مضافة
                </div>

            </div>

        </div>


        <!-- PS5 -->

        <div class="parts-section">

            <div class="section-head">

                <div class="console">
                    PS5
                </div>

                <button class="add-btn" onclick="openAdd('PS5')">
                    ＋ إضافة قطعة
                </button>

            </div>


            <div class="table-head">

                <div>القطعة</div>
                <div>النوع</div>
                <div>قطاعي</div>
                <div>تجاري</div>
                <div>العدد</div>
                <div>الإجراءات</div>

            </div>


            <div id="ps5-list">

                <div class="empty" id="ps5-empty">
                    لا توجد قطع غيار مضافة
                </div>

            </div>

        </div>

    </div>


    <!-- نافذة إضافة قطعة -->

    <div class="modal" id="addModal">

        <div class="modal-box">

            <h2>
                إضافة قطعة
            </h2>


            <label>
                اسم القطعة
            </label>

            <input
                id="partName"
                type="text"
                placeholder="اكتب اسم القطعة"
            >


            <label>
                النوع
            </label>

            <select id="partType">

                <option value="مفردة">
                    مفردة
                </option>

                <option value="مزدوجة (ترقيم/أمامي)">
                    مزدوجة (ترقيم/أمامي)
                </option>

            </select>


            <label>
                السعر القطاعي
            </label>

            <input
                id="retailPrice"
                type="number"
                placeholder="السعر القطاعي"
            >


            <label>
                السعر التجاري
            </label>

            <input
                id="commercialPrice"
                type="number"
                placeholder="السعر التجاري"
            >


            <label>
                العدد
            </label>

            <input
                id="partQuantity"
                type="number"
                value="0"
                min="0"
            >


            <div class="modal-buttons">

                <button
                    class="cancel"
                    onclick="closeAdd()"
                >
                    إلغاء
                </button>

                <button
                    class="save"
                    onclick="addPart()"
                >
                    حفظ
                </button>

            </div>

        </div>

    </div>


    <!-- أزرار أسفل الشاشة -->

    <div class="bottom-left">

        <button
            onclick="window.location.href='controllers.html'"
            title="رجوع"
        >
            ↩️
        </button>

        <button
            onclick="toggleLight()"
            title="تغيير الإضاءة"
        >
            🌙
        </button>

    </div>


    <script>

        let selectedConsole = "";


        function openAdd(consoleType) {

            selectedConsole = consoleType;

            document.getElementById("addModal").style.display = "flex";

        }


        function closeAdd() {

            document.getElementById("addModal").style.display = "none";

        }


        function addPart() {

            const name =
                document.getElementById("partName").value.trim();

            const type =
                document.getElementById("partType").value;

            const retail =
                document.getElementById("retailPrice").value;

            const commercial =
                document.getElementById("commercialPrice").value;

            const quantity =
                document.getElementById("partQuantity").value;


            if (name === "") {

                alert("اكتب اسم القطعة أولاً");

                return;

            }


            const row =
                document.createElement("div");

            row.className = "part-row";


            row.innerHTML = `

                <div class="part-name">
                    ${name}
                </div>

                <div class="part-type">
                    ${type}
                </div>

                <div class="price">
                    ${retail || "0"}
                </div>

                <div class="price">
                    ${commercial || "0"}
                </div>

                <div class="quantity">
                    ${quantity || "0"}
                </div>

                <div class="actions">

                    <button
                        class="edit"
                        onclick="editPart(this)"
                    >
                        ✏️ تعديل
                    </button>

                    <button
                        class="delete"
                        onclick="deletePart(this)"
                    >
                        🗑 حذف
                    </button>

                </div>

            `;


            const list =
                document.getElementById(
                    selectedConsole === "PS4"
                        ? "ps4-list"
                        : "ps5-list"
                );


            const empty =
                document.getElementById(
                    selectedConsole === "PS4"
                        ? "ps4-empty"
                        : "ps5-empty"
                );


            if (empty) {
                empty.remove();
            }


            list.appendChild(row);


            document.getElementById("partName").value = "";
            document.getElementById("retailPrice").value = "";
            document.getElementById("commercialPrice").value = "";
            document.getElementById("partQuantity").value = "0";


            closeAdd();

        }


        function deletePart(button) {

            const row =
                button.closest(".part-row");

            row.remove();

        }


        function editPart(button) {

            const row =
                button.closest(".part-row");

            const name =
                row.querySelector(".part-name").textContent.trim();

            const type =
                row.querySelector(".part-type").textContent.trim();

            const retail =
                row.querySelectorAll(".price")[0].textContent.trim();

            const commercial =
                row.querySelectorAll(".price")[1].textContent.trim();

            const quantity =
                row.querySelector(".quantity").textContent.trim();


            document.getElementById("partName").value = name;

            document.getElementById("partType").value = type;

            document.getElementById("retailPrice").value = retail;

            document.getElementById("commercialPrice").value = commercial;

            document.getElementById("partQuantity").value = quantity;


            selectedConsole =
                row.closest("#ps4-list")
                    ? "PS4"
                    : "PS5";


            row.remove();


            document.getElementById("addModal").style.display = "flex";

        }


        function toggleLight() {

            document.body.style.background =
                document.body.style.background === "rgb(241, 241, 241)"
                    ? "#0b0b0b"
                    : "#f1f1f1";

        }


        window.onclick = function(event) {

            const modal =
                document.getElementById("addModal");

            if (event.target === modal) {

                closeAdd();

            }

        };

    </script>

</body>

</html>
