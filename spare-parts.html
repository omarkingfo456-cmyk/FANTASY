<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fantasy Store - قطع الغيار</title>

<style>
*{
    box-sizing:border-box;
    font-family:Tahoma,Arial,sans-serif;
}

body{
    margin:0;
    background:#080b10;
    color:#fff;
}

/* الشريط العلوي */
.topbar{
    height:70px;
    background:#11151c;
    border-bottom:1px solid #26303d;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 25px;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    color:#ffc400;
    font-size:23px;
    font-weight:bold;
}

.top-buttons{
    display:flex;
    gap:8px;
}

.top-buttons button{
    border:1px solid #34404f;
    background:#1a2029;
    color:#fff;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
}

.top-buttons button:hover{
    border-color:#ffc400;
    color:#ffc400;
}

.exit-btn{
    background:#421b1b !important;
    border-color:#733030 !important;
    color:#ff7777 !important;
}

/* المحتوى */
.container{
    max-width:1200px;
    margin:auto;
    padding:25px;
}

.header-box{
    background:linear-gradient(135deg,#101720,#0c1118);
    border:1px solid #26384d;
    border-radius:15px;
    padding:25px;
    margin-bottom:22px;
}

.header-box h1{
    margin:0 0 8px;
    color:#ffc400;
    font-size:28px;
}

.header-box p{
    margin:0;
    color:#8e9aaa;
}

/* الأقسام */
.console-box{
    background:#0e141b;
    border:1px solid #26384d;
    border-radius:15px;
    padding:20px;
    margin-bottom:22px;
}

.console-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.console-header h2{
    margin:0;
    font-size:21px;
}

.count{
    color:#ffc400;
    font-size:13px;
    margin-right:8px;
}

.add-btn{
    background:#ffc400;
    color:#111;
    border:0;
    padding:11px 18px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.add-btn:hover{
    background:#e5ae00;
}

/* الجدول */
.table-head,
.part-row{
    display:grid;
    grid-template-columns:2fr 1.3fr 1.2fr 1.2fr .8fr 1.4fr;
    gap:10px;
    align-items:center;
}

.table-head{
    background:#17202a;
    color:#ffc400;
    padding:13px;
    border-radius:8px;
    font-size:13px;
}

.part-row{
    background:#111820;
    border:1px solid #202c39;
    padding:12px;
    margin-top:7px;
    border-radius:8px;
}

.part-name{
    font-weight:bold;
}

.part-type{
    color:#d6d6d6;
}

.price,
.quantity{
    text-align:center;
}

.actions{
    display:flex;
    gap:6px;
}

.actions button{
    border:0;
    color:#fff;
    padding:7px 10px;
    border-radius:6px;
    cursor:pointer;
}

.edit{
    background:#1765aa;
}

.delete{
    background:#a52323;
}

.empty{
    text-align:center;
    color:#687585;
    padding:25px;
}

/* النافذة */
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.8);
    align-items:center;
    justify-content:center;
    z-index:999;
    padding:15px;
}

.modal-box{
    width:100%;
    max-width:480px;
    background:#10161e;
    border:1px solid #ffc400;
    border-radius:15px;
    padding:25px;
    box-shadow:0 15px 50px rgba(0,0,0,.7);
}

.modal-title{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:22px;
}

.modal-title h2{
    margin:0;
    color:#ffc400;
    font-size:21px;
}

.close{
    width:35px;
    height:35px;
    border:0;
    border-radius:7px;
    background:#242b34;
    color:#fff;
    font-size:20px;
    cursor:pointer;
}

.field{
    margin-bottom:15px;
}

.field label{
    display:block;
    color:#d8d8d8;
    margin-bottom:7px;
    font-size:14px;
}

.field input,
.field select{
    width:100%;
    padding:12px;
    border-radius:8px;
    border:1px solid #334252;
    background:#18212b;
    color:#fff;
    outline:none;
}

.field input:focus,
.field select:focus{
    border-color:#ffc400;
}

.save-btn{
    width:100%;
    padding:13px;
    background:#ffc400;
    color:#111;
    border:0;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
    font-size:15px;
}

.cancel-btn{
    width:100%;
    padding:11px;
    margin-top:9px;
    background:#293442;
    color:#fff;
    border:0;
    border-radius:8px;
    cursor:pointer;
}

/* الموبايل */
@media(max-width:700px){

    .topbar{
        height:auto;
        padding:12px;
        flex-direction:column;
        gap:12px;
    }

    .top-buttons{
        flex-wrap:wrap;
        justify-content:center;
    }

    .container{
        padding:12px;
    }

    .console-header{
        flex-direction:column;
        gap:12px;
        align-items:stretch;
    }

    .add-btn{
        width:100%;
    }

    .table-head{
        display:none;
    }

    .part-row{
        grid-template-columns:1fr 1fr;
        gap:12px;
    }

    .actions{
        grid-column:1/-1;
    }
}
</style>
</head>

<body>

<!-- الشريط العلوي -->
<div class="topbar">

    <div class="logo">
        🎮 FANTASY STORE
    </div>

    <div class="top-buttons">

        <button onclick="goHome()">
            🏠 الرئيسية
        </button>

        <button onclick="location.href='settings.html'">
            ⚙️ الإعدادات
        </button>

        <button onclick="toggleTheme()">
            💡 الوضع
        </button>

        <button class="exit-btn" onclick="goBack()">
            🚪 خروج
        </button>

    </div>

</div>


<div class="container">

    <!-- العنوان -->
    <div class="header-box">

        <h1>🔧 إدارة قطع الغيار</h1>

        <p>
            إدارة قطع غيار خاصة بدراعات فور وفايف
        </p>

    </div>


    <!-- PS4 -->
    <div class="console-box">

        <div class="console-header">

            <h2>
                🎮 قطع غيار PS4
                <span class="count" id="ps4Count">0 قطعة</span>
            </h2>

            <button class="add-btn" onclick="openAdd('PS4')">
                ➕ إضافة قطعة
            </button>

        </div>


        <div class="table-head">

            <div>اسم القطعة</div>
            <div>نوع القطعة</div>
            <div>السعر القطاعي</div>
            <div>السعر التجاري</div>
            <div>الكمية</div>
            <div>الإجراءات</div>

        </div>

        <div id="ps4-list"></div>

    </div>


    <!-- PS5 -->
    <div class="console-box">

        <div class="console-header">

            <h2>
                🎮 قطع غيار PS5
                <span class="count" id="ps5Count">0 قطعة</span>
            </h2>

            <button class="add-btn" onclick="openAdd('PS5')">
                ➕ إضافة قطعة
            </button>

        </div>


        <div class="table-head">

            <div>اسم القطعة</div>
            <div>نوع القطعة</div>
            <div>السعر القطاعي</div>
            <div>السعر التجاري</div>
            <div>الكمية</div>
            <div>الإجراءات</div>

        </div>

        <div id="ps5-list"></div>

    </div>

</div>


<!-- نافذة إضافة القطعة -->
<div class="modal" id="modal">

    <div class="modal-box">

        <div class="modal-title">

            <h2 id="modalTitle">
                ➕ إضافة قطعة جديدة
            </h2>

            <button class="close" onclick="closeModal()">
                ×
            </button>

        </div>


        <!-- اسم القطعة -->
        <div class="field">

            <label>اسم القطعة</label>

            <input
                type="text"
                id="partName"
                placeholder="اكتب اسم القطعة"
            >

        </div>


        <!-- السعر القطاعي -->
        <div class="field">

            <label>السعر القطاعي</label>

            <input
                type="number"
                id="retailPrice"
                placeholder="اكتب السعر القطاعي"
                min="0"
            >

        </div>


        <!-- السعر التجاري -->
        <div class="field">

            <label>السعر التجاري</label>

            <input
                type="number"
                id="commercialPrice"
                placeholder="اكتب السعر التجاري"
                min="0"
            >

        </div>


        <!-- الكمية -->
        <div class="field">

            <label>الكمية</label>

            <input
                type="number"
                id="partQuantity"
                value="0"
                min="0"
            >

        </div>


        <!-- نوع القطعة -->
        <div class="field">

            <label>نوع القطعة</label>

            <select id="partType">

                <option value="مفردة">
                    مفردة
                </option>

                <option value="مزدوجة (ترقيم/أمامي)">
                    مزدوجة (ترقيم/أمامي)
                </option>

            </select>

        </div>


        <!-- حفظ -->
        <button class="save-btn" onclick="savePart()">
            💾 حفظ القطعة
        </button>

        <button class="cancel-btn" onclick="closeModal()">
            إلغاء
        </button>

    </div>

</div>


<script>

const STORAGE_KEY = "fantasySpareParts";

let selectedConsole = "";
let editingId = null;


/* قراءة القطع المحفوظة */

function getParts(){

    try{

        return JSON.parse(
            localStorage.getItem(STORAGE_KEY)
        ) || [];

    }catch(error){

        return [];

    }

}


/* حفظ القطع */

function saveParts(parts){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(parts)
    );

}


/* فتح الإضافة */

function openAdd(consoleType){

    selectedConsole = consoleType;
    editingId = null;

    document.getElementById("modalTitle").textContent =
        "➕ إضافة قطعة " + consoleType;

    document.getElementById("partName").value = "";
    document.getElementById("retailPrice").value = "";
    document.getElementById("commercialPrice").value = "";
    document.getElementById("partQuantity").value = "0";
    document.getElementById("partType").value = "مفردة";

    document.getElementById("modal").style.display = "flex";

}


/* إغلاق */

function closeModal(){

    document.getElementById("modal").style.display = "none";

}


/* حفظ القطعة */

function savePart(){

    const name =
        document.getElementById("partName").value.trim();

    const retail =
        document.getElementById("retailPrice").value || "0";

    const commercial =
        document.getElementById("commercialPrice").value || "0";

    const quantity =
        document.getElementById("partQuantity").value || "0";

    const type =
        document.getElementById("partType").value;


    if(name === ""){

        alert("من فضلك اكتب اسم القطعة");

        return;

    }


    let parts = getParts();


    /* تعديل */

    if(editingId !== null){

        const index =
            parts.findIndex(
                p => p.id === editingId
            );


        if(index !== -1){

            parts[index].name = name;
            parts[index].retail = retail;
            parts[index].commercial = commercial;
            parts[index].quantity = quantity;
            parts[index].type = type;

        }

    }

    /* إضافة */

    else{

        parts.push({

            id: Date.now().toString(),

            console: selectedConsole,

            name: name,

            retail: retail,

            commercial: commercial,

            quantity: quantity,

            type: type

        });

    }


    /* الحفظ الحقيقي */

    saveParts(parts);

    renderParts();

    closeModal();

}


/* عرض القطع */

function renderParts(){

    const ps4List =
        document.getElementById("ps4-list");

    const ps5List =
        document.getElementById("ps5-list");


    ps4List.innerHTML = "";
    ps5List.innerHTML = "";


    const parts = getParts();


    const ps4Parts =
        parts.filter(p => p.console === "PS4");

    const ps5Parts =
        parts.filter(p => p.console === "PS5");


    document.getElementById("ps4Count").textContent =
        ps4Parts.length + " قطعة";

    document.getElementById("ps5Count").textContent =
        ps5Parts.length + " قطعة";


    if(ps4Parts.length === 0){

        ps4List.innerHTML =
            '<div class="empty">لا توجد قطع غيار PS4</div>';

    }else{

        ps4Parts.forEach(function(part){

            ps4List.appendChild(
                createRow(part)
            );

        });

    }


    if(ps5Parts.length === 0){

        ps5List.innerHTML =
            '<div class="empty">لا توجد قطع غيار PS5</div>';

    }else{

        ps5Parts.forEach(function(part){

            ps5List.appendChild(
                createRow(part)
            );

        });

    }

}


/* إنشاء الصف */

function createRow(part){

    const row =
        document.createElement("div");

    row.className = "part-row";


    const name =
        document.createElement("div");

    name.className = "part-name";
    name.textContent = part.name;


    const type =
        document.createElement("div");

    type.className = "part-type";
    type.textContent = part.type;


    const retail =
        document.createElement("div");

    retail.className = "price";
    retail.textContent = part.retail + " ج";


    const commercial =
        document.createElement("div");

    commercial.className = "price";
    commercial.textContent = part.commercial + " ج";


    const quantity =
        document.createElement("div");

    quantity.className = "quantity";
    quantity.textContent = part.quantity;


    const actions =
        document.createElement("div");

    actions.className = "actions";


    const edit =
        document.createElement("button");

    edit.className = "edit";
    edit.textContent = "✏️ تعديل";

    edit.onclick = function(){

        editPart(part.id);

    };


    const del =
        document.createElement("button");

    del.className = "delete";
    del.textContent = "🗑 حذف";

    del.onclick = function(){

        deletePart(part.id);

    };


    actions.appendChild(edit);
    actions.appendChild(del);


    row.appendChild(name);
    row.appendChild(type);
    row.appendChild(retail);
    row.appendChild(commercial);
    row.appendChild(quantity);
    row.appendChild(actions);


    return row;

}


/* تعديل */

function editPart(id){

    const parts = getParts();

    const part =
        parts.find(
            p => p.id === id
        );


    if(!part) return;


    editingId = id;

    selectedConsole = part.console;


    document.getElementById("modalTitle").textContent =
        "✏️ تعديل القطعة";


    document.getElementById("partName").value =
        part.name;

    document.getElementById("retailPrice").value =
        part.retail;

    document.getElementById("commercialPrice").value =
        part.commercial;

    document.getElementById("partQuantity").value =
        part.quantity;

    document.getElementById("partType").value =
        part.type;


    document.getElementById("modal").style.display =
        "flex";

}


/* حذف */

function deletePart(id){

    if(!confirm("هل تريد حذف هذه القطعة؟")){

        return;

    }


    let parts = getParts();


    parts =
        parts.filter(
            p => p.id !== id
        );


    saveParts(parts);

    renderParts();

}


/* الرئيسية */

function goHome(){

    /*
      هنا هنرجع للصفحة الرئيسية
      غيّر الاسم فقط لو صفحتك الرئيسية
      اسمها مختلف
    */

    window.location.href = "home.html";

}


/* خروج من صفحة قطع الغيار فقط */

function goBack(){

    window.location.href = "home.html";

}


/* تغيير الوضع */

function toggleTheme(){

    const current =
        localStorage.getItem("fantasyTheme");


    if(current === "light"){

        localStorage.setItem(
            "fantasyTheme",
            "dark"
        );

        document.body.style.background =
            "#080b10";

    }else{

        localStorage.setItem(
            "fantasyTheme",
            "light"
        );

        document.body.style.background =
            "#eeeeee";

    }

}


/* الضغط خارج النافذة */

window.onclick = function(event){

    const modal =
        document.getElementById("modal");


    if(event.target === modal){

        closeModal();

    }

};


/* تحميل البيانات عند فتح الصفحة */

document.addEventListener(
    "DOMContentLoaded",
    function(){

        renderParts();

    }
);

</script>

</body>
</html>
