<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>قطع الغيار - Fantasy Store</title>

<style>
* {
    box-sizing: border-box;
    font-family: Arial, Tahoma, sans-serif;
}

body {
    margin: 0;
    background: #0b0b0b;
    color: white;
}

.topbar {
    height: 65px;
    background: #151515;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    border-bottom: 1px solid #333;
}

.logo {
    color: #ffd000;
    font-size: 22px;
    font-weight: bold;
}

.menu {
    display: flex;
    gap: 10px;
}

.menu button {
    background: #222;
    color: white;
    border: 1px solid #444;
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
}

.menu button:hover {
    background: #333;
}

.container {
    padding: 25px;
    max-width: 1200px;
    margin: auto;
}

.title {
    font-size: 28px;
    color: #ffd000;
    margin-bottom: 25px;
}

.console-box {
    background: #151515;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 25px;
}

.console-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
}

.console-header h2 {
    margin: 0;
    color: #fff;
}

.add-btn {
    background: #ffd000;
    color: #000;
    border: none;
    padding: 10px 16px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.add-btn:hover {
    background: #e6bb00;
}

.table-head,
.part-row {
    display: grid;
    grid-template-columns: 2fr 1.3fr 1fr 1fr 1fr 1.5fr;
    gap: 10px;
    align-items: center;
}

.table-head {
    background: #222;
    padding: 12px;
    border-radius: 8px;
    color: #ffd000;
    font-weight: bold;
}

.part-row {
    background: #1c1c1c;
    padding: 12px;
    margin-top: 8px;
    border-radius: 8px;
    border: 1px solid #2d2d2d;
}

.part-name {
    font-weight: bold;
}

.price,
.quantity {
    text-align: center;
}

.actions {
    display: flex;
    gap: 6px;
}

.actions button {
    border: none;
    padding: 7px 10px;
    border-radius: 6px;
    cursor: pointer;
    color: white;
}

.edit {
    background: #2878d7;
}

.delete {
    background: #c62828;
}

.empty {
    text-align: center;
    color: #888;
    padding: 25px;
}

/* Modal */
.modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.modal-box {
    width: 95%;
    max-width: 500px;
    background: #171717;
    border: 1px solid #444;
    border-radius: 12px;
    padding: 22px;
}

.modal-box h2 {
    color: #ffd000;
    margin-top: 0;
}

.input-group {
    margin-bottom: 14px;
}

.input-group label {
    display: block;
    margin-bottom: 6px;
    color: #ddd;
}

.input-group input,
.input-group select {
    width: 100%;
    padding: 11px;
    background: #222;
    border: 1px solid #444;
    color: white;
    border-radius: 7px;
    outline: none;
}

.input-group input:focus,
.input-group select:focus {
    border-color: #ffd000;
}

.modal-buttons {
    display: flex;
    gap: 10px;
    margin-top: 18px;
}

.save-btn,
.cancel-btn {
    flex: 1;
    padding: 11px;
    border: none;
    border-radius: 7px;
    cursor: pointer;
    font-weight: bold;
}

.save-btn {
    background: #ffd000;
    color: black;
}

.cancel-btn {
    background: #444;
    color: white;
}

@media (max-width: 700px) {
    .topbar {
        height: auto;
        padding: 12px;
        flex-direction: column;
        gap: 10px;
    }

    .menu {
        flex-wrap: wrap;
        justify-content: center;
    }

    .container {
        padding: 12px;
    }

    .table-head {
        display: none;
    }

    .part-row {
        grid-template-columns: 1fr 1fr;
    }

    .actions {
        grid-column: 1 / -1;
    }
}
</style>
</head>

<body>

<div class="topbar">
    <div class="logo">FANTASY STORE</div>

    <div class="menu">
        <button onclick="location.href='spare-parts.html'">
            🔧 قطع الغيار
        </button>

        <button onclick="location.href='settings.html'">
            ⚙️ الإعدادات
        </button>

        <button onclick="toggleLight()">
            ☀️ الوضع
        </button>
    </div>
</div>

<div class="container">

    <div class="title">🔧 إدارة قطع الغيار</div>

    <!-- PS4 -->
    <div class="console-box">
        <div class="console-header">
            <h2>🎮 قطع غيار PS4</h2>
            <button class="add-btn" onclick="openAdd('PS4')">
                ➕ إضافة قطعة
            </button>
        </div>

        <div class="table-head">
            <div>اسم القطعة</div>
            <div>النوع</div>
            <div>سعر البيع</div>
            <div>سعر الجملة</div>
            <div>الكمية</div>
            <div>الإجراءات</div>
        </div>

        <div id="ps4-list"></div>
    </div>

    <!-- PS5 -->
    <div class="console-box">
        <div class="console-header">
            <h2>🎮 قطع غيار PS5</h2>
            <button class="add-btn" onclick="openAdd('PS5')">
                ➕ إضافة قطعة
            </button>
        </div>

        <div class="table-head">
            <div>اسم القطعة</div>
            <div>النوع</div>
            <div>سعر البيع</div>
            <div>سعر الجملة</div>
            <div>الكمية</div>
            <div>الإجراءات</div>
        </div>

        <div id="ps5-list"></div>
    </div>

</div>

<!-- نافذة إضافة قطعة -->
<div class="modal" id="addModal">

    <div class="modal-box">

        <h2 id="modalTitle">➕ إضافة قطعة</h2>

        <div class="input-group">
            <label>اسم القطعة</label>
            <input type="text" id="partName" placeholder="مثال: أنالوج">
        </div>

        <div class="input-group">
            <label>نوع القطعة</label>
            <select id="partType">
                <option value="أصلي">أصلي</option>
                <option value="كوبي">كوبي</option>
                <option value="تجاري">تجاري</option>
            </select>
        </div>

        <div class="input-group">
            <label>سعر البيع</label>
            <input type="number" id="retailPrice" placeholder="0">
        </div>

        <div class="input-group">
            <label>سعر الجملة</label>
            <input type="number" id="commercialPrice" placeholder="0">
        </div>

        <div class="input-group">
            <label>الكمية</label>
            <input type="number" id="partQuantity" value="0" min="0">
        </div>

        <div class="modal-buttons">
            <button class="save-btn" onclick="savePart()">
                💾 حفظ
            </button>

            <button class="cancel-btn" onclick="closeAdd()">
                إلغاء
            </button>
        </div>

    </div>
</div>

<script>

const STORAGE_KEY = "fantasySpareParts";

let selectedConsole = "";
let editingId = null;


/* تحميل البيانات */
function getParts() {
    try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch (error) {
        return [];
    }
}


/* حفظ البيانات */
function saveParts(parts) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(parts));
}


/* فتح نافذة الإضافة */
function openAdd(consoleType) {

    selectedConsole = consoleType;
    editingId = null;

    document.getElementById("modalTitle").textContent =
        "➕ إضافة قطعة " + consoleType;

    document.getElementById("partName").value = "";
    document.getElementById("partType").value = "أصلي";
    document.getElementById("retailPrice").value = "";
    document.getElementById("commercialPrice").value = "";
    document.getElementById("partQuantity").value = "0";

    document.getElementById("addModal").style.display = "flex";
}


/* إغلاق النافذة */
function closeAdd() {
    document.getElementById("addModal").style.display = "none";
}


/* حفظ قطعة جديدة أو تعديل قطعة */
function savePart() {

    const name = document.getElementById("partName").value.trim();
    const type = document.getElementById("partType").value;
    const retail = document.getElementById("retailPrice").value || "0";
    const commercial = document.getElementById("commercialPrice").value || "0";
    const quantity = document.getElementById("partQuantity").value || "0";

    if (name === "") {
        alert("اكتب اسم القطعة أولاً");
        return;
    }

    let parts = getParts();

    if (editingId !== null) {

        const index = parts.findIndex(p => p.id === editingId);

        if (index !== -1) {
            parts[index].name = name;
            parts[index].type = type;
            parts[index].retail = retail;
            parts[index].commercial = commercial;
            parts[index].quantity = quantity;
        }

    } else {

        parts.push({
            id: Date.now().toString(),
            console: selectedConsole,
            name: name,
            type: type,
            retail: retail,
            commercial: commercial,
            quantity: quantity
        });

    }

    saveParts(parts);

    renderParts();

    closeAdd();
}


/* عرض القطع */
function renderParts() {

    const ps4List = document.getElementById("ps4-list");
    const ps5List = document.getElementById("ps5-list");

    ps4List.innerHTML = "";
    ps5List.innerHTML = "";

    const parts = getParts();

    const ps4Parts = parts.filter(p => p.console === "PS4");
    const ps5Parts = parts.filter(p => p.console === "PS5");

    if (ps4Parts.length === 0) {
        ps4List.innerHTML =
            '<div class="empty">لا توجد قطع غيار PS4 حتى الآن</div>';
    } else {
        ps4Parts.forEach(part => {
            ps4List.appendChild(createRow(part));
        });
    }

    if (ps5Parts.length === 0) {
        ps5List.innerHTML =
            '<div class="empty">لا توجد قطع غيار PS5 حتى الآن</div>';
    } else {
        ps5Parts.forEach(part => {
            ps5List.appendChild(createRow(part));
        });
    }
}


/* إنشاء صف القطعة */
function createRow(part) {

    const row = document.createElement("div");
    row.className = "part-row";
    row.dataset.id = part.id;

    const name = document.createElement("div");
    name.className = "part-name";
    name.textContent = part.name;

    const type = document.createElement("div");
    type.className = "part-type";
    type.textContent = part.type;

    const retail = document.createElement("div");
    retail.className = "price";
    retail.textContent = part.retail;

    const commercial = document.createElement("div");
    commercial.className = "price";
    commercial.textContent = part.commercial;

    const quantity = document.createElement("div");
    quantity.className = "quantity";
    quantity.textContent = part.quantity;

    const actions = document.createElement("div");
    actions.className = "actions";

    const editButton = document.createElement("button");
    editButton.className = "edit";
    editButton.textContent = "✏️ تعديل";

    editButton.onclick = function() {
        editPart(part.id);
    };

    const deleteButton = document.createElement("button");
    deleteButton.className = "delete";
    deleteButton.textContent = "🗑 حذف";

    deleteButton.onclick = function() {
        deletePart(part.id);
    };

    actions.appendChild(editButton);
    actions.appendChild(deleteButton);

    row.appendChild(name);
    row.appendChild(type);
    row.appendChild(retail);
    row.appendChild(commercial);
    row.appendChild(quantity);
    row.appendChild(actions);

    return row;
}


/* حذف */
function deletePart(id) {

    if (!confirm("هل تريد حذف هذه القطعة؟")) {
        return;
    }

    let parts = getParts();

    parts = parts.filter(part => part.id !== id);

    saveParts(parts);

    renderParts();
}


/* تعديل */
function editPart(id) {

    const parts = getParts();

    const part = parts.find(p => p.id === id);

    if (!part) return;

    editingId = id;
    selectedConsole = part.console;

    document.getElementById("modalTitle").textContent =
        "✏️ تعديل القطعة";

    document.getElementById("partName").value = part.name;
    document.getElementById("partType").value = part.type;
    document.getElementById("retailPrice").value = part.retail;
    document.getElementById("commercialPrice").value = part.commercial;
    document.getElementById("partQuantity").value = part.quantity;

    document.getElementById("addModal").style.display = "flex";
}


/* الوضع الفاتح / الداكن */
function toggleLight() {

    const isLight = document.body.classList.toggle("light");

    if (isLight) {
        document.body.style.background = "#f1f1f1";
        document.body.style.color = "#111";
    } else {
        document.body.style.background = "#0b0b0b";
        document.body.style.color = "white";
    }

    localStorage.setItem("fantasyLightMode", isLight ? "1" : "0");
}


/* إغلاق النافذة عند الضغط خارجها */
window.onclick = function(event) {

    const modal = document.getElementById("addModal");

    if (event.target === modal) {
        closeAdd();
    }

};


/* تشغيل الصفحة */
document.addEventListener("DOMContentLoaded", function() {

    renderParts();

    if (localStorage.getItem("fantasyLightMode") === "1") {
        document.body.classList.add("light");
        document.body.style.background = "#f1f1f1";
        document.body.style.color = "#111";
    }

});

</script>

</body>
</html>
